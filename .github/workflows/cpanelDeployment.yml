name: Deploy Website to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Get the latest code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Check the available PHP and Composer
      - name: Check PHP and Composer
        run: |
          php --version
          composer --version

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 4. Build frontend assets
      - name: Build frontend
        run: npm run build

      # 5. Install Laravel dependencies
      #
      # Dev dependencies are included because Laravel is currently
      # loading the Collision service provider during package discovery.
      - name: Install PHP dependencies
        run: |
          composer install \
            --optimize-autoloader \
            --no-interaction

      # 6. Install FTP client
      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      # 7. Deploy to cPanel
      - name: Deploy to cPanel
        env:
          FTP_SERVER: ${{ secrets.SERVER }}
          FTP_USERNAME: ${{ secrets.USERNAME }}
          FTP_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;

            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;

            mirror \
              --reverse \
              --verbose \
              --parallel=4 \
              --exclude-glob=.git/** \
              --exclude-glob=.github/** \
              --exclude-glob=node_modules/** \
              --exclude-glob=.env \
              --exclude-glob=.env.* \
              --exclude-glob=storage/logs/** \
              ./ /public_html/;
          "
