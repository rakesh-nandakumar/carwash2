name: Deploy Website to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Get the latest code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Check PHP and Composer
      - name: Check PHP and Composer
        run: |
          php --version
          composer --version

      # 3. Install frontend dependencies
      - name: Install frontend dependencies
        run: npm ci

      # 4. Build frontend
      - name: Build frontend
        run: npm run build

      # 5. Install Laravel dependencies
      - name: Install PHP dependencies
        run: |
          composer install \
            --optimize-autoloader \
            --no-interaction

      # 6. Install Zip & FTP client
      - name: Install Zip and FTP client
        run: |
          sudo apt-get update
          sudo apt-get install -y zip lftp

      # 7. Compress project files into a single ZIP
      - name: Archive project files
        run: |
          zip -r deploy.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x ".env" \
            -x ".env.*" \
            -x "storage/logs/*"

      # 8. Create temporary PHP extractor script
      - name: Create Unzip Script
        run: |
          cat << 'EOF' > unzip.php
          <?php
          // Since this script runs from /public, we look for the zip one level up
          $zipFile = dirname(__DIR__) . '/deploy.zip';
          $extractTo = dirname(__DIR__);

          if (file_exists($zipFile)) {
              $zip = new ZipArchive;
              if ($zip->open($zipFile) === TRUE) {
                  $zip->extractTo($extractTo);
                  $zip->close();
                  @unlink($zipFile);
                  @unlink(__FILE__);
                  echo "Extraction successful!";
              } else {
                  echo "Failed to open zip archive.";
              }
          } else {
              echo "Zip file not found at: " . $zipFile;
          }
          EOF

      # 9. Deploy ZIP to cPanel and run extraction
      - name: Deploy to cPanel
        env:
          FTP_SERVER: "business196.web-hosting.com"
          FTP_USERNAME: "auto_ftp@autocare.vellixglobal.com"
          FTP_PASSWORD: ",ZAuB1Hj@l?$EZW="
        run: |
          echo "Checking FTP server..."

          if ! getent hosts "$FTP_SERVER"; then
            echo "FTP server could not be resolved."
            exit 1
          fi

          echo "FTP server resolved successfully. Uploading ZIP package..."

          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;

            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\";

            put deploy.zip;
            # Place the unzip script inside the public folder so it's accessible via URL
            put unzip.php -o public/unzip.php;
          "

          echo "Triggering remote extraction..."
          # The -f flag ensures GitHub catches any 404/500 errors and fails the build if it doesn't work
          curl -f -s -L "http://autocare.vellixglobal.com/unzip.php"
          echo "Deployment complete!"
